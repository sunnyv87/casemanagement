  <rect x="270" y="416" width="52" height="18" rx="9" fill="#fef2f2"/>
  <text x="296" y="429" text-anchor="middle" fill="#991b1b" font-size="9" font-weight="500">critical</text>
  <text x="616" y="429" fill="#111827" font-size="12" text-anchor="end" font-weight="500">12</text>

  <rect x="270" y="446" width="36" height="18" rx="9" fill="#fff7ed"/>
  <text x="288" y="459" text-anchor="middle" fill="#9a3412" font-size="9" font-weight="500">high</text>
  <text x="616" y="459" fill="#111827" font-size="12" text-anchor="end" font-weight="500">38</text>

  <rect x="270" y="476" width="52" height="18" rx="9" fill="#fef9c3"/>
  <text x="296" y="489" text-anchor="middle" fill="#854d0e" font-size="9" font-weight="500">medium</text>
  <text x="616" y="489" fill="#111827" font-size="12" text-anchor="end" font-weight="500">67</text>

  <rect x="270" y="506" width="32" height="18" rx="9" fill="#dcfce7"/>
  <text x="286" y="519" text-anchor="middle" fill="#166534" font-size="9" font-weight="500">low</text>
  <text x="616" y="519" fill="#111827" font-size="12" text-anchor="end" font-weight="500">39</text>

