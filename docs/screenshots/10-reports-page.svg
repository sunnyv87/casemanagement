  <rect x="660" y="370" width="410" height="200" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="686" y="398" fill="#111827" font-size="14" font-weight="600">SLA Performance</text>

  <text x="686" y="434" fill="#6b7280" font-size="12">Response SLA Met</text>
  <text x="1040" y="434" fill="#22c55e" font-size="12" text-anchor="end" font-weight="500">21 / 23</text>

  <text x="686" y="468" fill="#6b7280" font-size="12">Resolution SLA Met</text>
  <text x="1040" y="468" fill="#22c55e" font-size="12" text-anchor="end" font-weight="500">19 / 23</text>

  <!-- SLA progress bars -->
  <rect x="686" y="486" width="360" height="8" rx="4" fill="#e5e7eb"/>
  <rect x="686" y="486" width="328" height="8" rx="4" fill="#22c55e"/>
  <text x="1040" y="508" fill="#6b7280" font-size="10" text-anchor="end">91% Response | 83% Resolution</text>

  <!-- Label -->
  <rect x="244" y="590" width="260" height="24" rx="6" fill="#dbeafe"/>
  <text x="254" y="606" fill="#1e40af" font-size="10" font-weight="500">Monthly Report View - Customer: Acme Financial</text>
