<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Consolas, Monaco, monospace">
  <rect width="800" height="400" fill="#1e1e2e" rx="12"/>
  <rect x="0" y="0" width="800" height="36" fill="#313244" rx="12"/>
  <rect x="0" y="24" width="800" height="12" fill="#313244"/>
  <circle cx="20" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="18" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="18" r="6" fill="#a6e3a1"/>
  <text x="400" y="22" text-anchor="middle" fill="#cdd6f4" font-size="12">Terminal - docker-compose ps</text>

  <text x="24" y="66" fill="#89b4fa" font-size="13">$</text>
  <text x="40" y="66" fill="#cdd6f4" font-size="13">docker-compose up -d</text>

  <text x="24" y="90" fill="#a6e3a1" font-size="12">Creating network "soc-platform_default" with the default driver</text>
  <text x="24" y="108" fill="#a6e3a1" font-size="12">Creating soc-platform_postgres_1  ... done</text>
  <text x="24" y="126" fill="#a6e3a1" font-size="12">Creating soc-platform_redis_1     ... done</text>
  <text x="24" y="144" fill="#a6e3a1" font-size="12">Creating soc-platform_rabbitmq_1  ... done</text>

  <text x="24" y="176" fill="#89b4fa" font-size="13">$</text>
  <text x="40" y="176" fill="#cdd6f4" font-size="13">docker-compose ps</text>

  <text x="24" y="204" fill="#6c7086" font-size="11">NAME                        STATUS          PORTS</text>
  <line x1="24" y1="210" x2="700" y2="210" stroke="#45475a" stroke-width="1"/>
  <text x="24" y="226" fill="#a6e3a1" font-size="11">soc-platform_postgres_1     Up (healthy)    0.0.0.0:5432->5432/tcp</text>
  <text x="24" y="246" fill="#a6e3a1" font-size="11">soc-platform_redis_1        Up (healthy)    0.0.0.0:6379->6379/tcp</text>
  <text x="24" y="266" fill="#a6e3a1" font-size="11">soc-platform_rabbitmq_1     Up (healthy)    0.0.0.0:5672->5672/tcp, 0.0.0.0:15672->15672/tcp</text>

  <text x="24" y="300" fill="#89b4fa" font-size="13">$</text>
  <text x="40" y="300" fill="#cdd6f4" font-size="13">docker-compose exec postgres pg_isready</text>
  <text x="24" y="320" fill="#a6e3a1" font-size="12">/var/run/postgresql:5432 - accepting connections</text>

  <text x="24" y="352" fill="#89b4fa" font-size="13">$</text>
  <text x="40" y="352" fill="#cdd6f4" font-size="13">docker-compose exec redis redis-cli ping</text>
  <text x="24" y="372" fill="#a6e3a1" font-size="12">PONG</text>
</svg>